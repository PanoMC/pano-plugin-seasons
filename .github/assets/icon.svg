<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B5BDB"/>
      <stop offset="0.55" stop-color="#7048E8"/>
      <stop offset="1" stop-color="#C2255C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD43B"/>
      <stop offset="1" stop-color="#F76707"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF0F6"/>
      <stop offset="1" stop-color="#F783AC"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1b1446" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="48" y="48" width="928" height="928" rx="220" fill="url(#bg)"/>
  <rect x="48" y="48" width="928" height="928" rx="220" fill="url(#glow)"/>

  <!-- snowflake -->
  <g transform="translate(400 420)" filter="url(#soft)" stroke="#fff" stroke-width="34" stroke-linecap="round" fill="none">
    <g id="arm">
      <line x1="0" y1="0" x2="0" y2="-210"/>
      <polyline points="-62,-150 0,-108 62,-150"/>
      <polyline points="-44,-212 0,-178 44,-212"/>
    </g>
    <use href="#arm" transform="rotate(60)"/>
    <use href="#arm" transform="rotate(120)"/>
    <use href="#arm" transform="rotate(180)"/>
    <use href="#arm" transform="rotate(240)"/>
    <use href="#arm" transform="rotate(300)"/>
    <circle r="26" fill="#fff" stroke="none"/>
  </g>

  <!-- autumn leaf -->
  <g transform="translate(712 690) rotate(-28)" filter="url(#soft)">
    <path d="M0,-170 C70,-120 120,-40 104,40 C92,100 46,140 0,170 C-46,140 -92,100 -104,40 C-120,-40 -70,-120 0,-170 Z" fill="url(#leaf)"/>
    <path d="M0,-140 L0,200" stroke="#B35400" stroke-width="12" stroke-linecap="round"/>
    <path d="M0,-40 L52,-86 M0,20 L64,-20 M0,-40 L-52,-86 M0,20 L-64,-20" stroke="#B35400" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- cherry blossom -->
  <g transform="translate(726 300)" filter="url(#soft)">
    <g id="pet"><path d="M0,0 C-46,-40 -44,-104 0,-128 C44,-104 46,-40 0,0 Z" fill="url(#petal)"/></g>
    <use href="#pet" transform="rotate(72)"/>
    <use href="#pet" transform="rotate(144)"/>
    <use href="#pet" transform="rotate(216)"/>
    <use href="#pet" transform="rotate(288)"/>
    <circle r="22" fill="#FFD43B"/>
  </g>

  <!-- sparkles -->
  <g fill="#fff">
    <path d="M300 760 l14 34 34 14 -34 14 -14 34 -14 -34 -34 -14 34 -14z"/>
    <circle cx="222" cy="640" r="12"/>
    <circle cx="560" cy="180" r="10" opacity="0.8"/>
    <circle cx="470" cy="820" r="9" opacity="0.7"/>
  </g>
</svg>
